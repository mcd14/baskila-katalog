<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baskıla | 3D Ürün Kataloğu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Soft ve modern bir font için Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Sticky Header -->
    <header class="header">
        <div class="header-container">
            <a href="#" class="logo"><img src="images/logo.svg" alt="Baskıla Logo"></a>
            <nav class="nav-links">
                <a href="#cakmak-kiliflari">Çakmak Kılıfları</a>
                <a href="#anahtarliklar">Anahtarlıklar</a>
                <a href="#clickerlar">Clickerlar</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Hero Slider -->
        <div class="slider-container">
            <div class="slider-content" id="sliderContent">
                <!-- JS ile dolacak -->
            </div>
            <div class="slider-decor"></div>
        </div>

        <!-- Ürün Vitrini (Kategoriler) -->
        <div id="productShowcase" class="product-showcase">
            <!-- JS ile dolacak -->
        </div>
    </main>

    <!-- Ürün Detay Modalı (Başlangıçta Gizli) -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="modal-body" id="modalBody">
                <!-- JS ile dolacak -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
